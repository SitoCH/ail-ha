name: Create Release

# Tag-driven release workflow for HACS.
# HACS (integration category) reads the latest git RELEASE/TAG on the repo it is
# pointed at. Releases are made via a REVIEWED version-bump PR (per PR discipline:
# never push to a merged branch). When that PR merges to main, this workflow:
#   1. reads the new manifest.json version
#   2. creates an annotated git tag v<version> (skip if it already exists)
#   3. creates a GitHub Release on that tag
# HACS then offers the new version automatically (hacs.json has no `version`
# field, so HACS updates are tag-driven/auto).
#
# Manual dispatch is kept as a fallback for re-running / repairing a release.

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/ail/manifest.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version from manifest
        id: meta
        run: |
          VER=$(python3 -c "import json;print(json.load(open('custom_components/ail/manifest.json'))['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER"

      - name: Create git tag if it does not already exist
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag creation"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG"
          fi

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.meta.outputs.version }}"
          name: "v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}